name: bot-selftest
# Шлёт боту тестовое сообщение как будто из Telegram (выдуманный чат), ждёт и сохраняет /health.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Тест
        env:
          TG_CLIENT_TOKEN: ${{ secrets.TG_CLIENT_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          # прямой вызов Gemini тем же ключом: код ответа и текст ошибки (ключ не печатаем)
          g=$(curl -s -m 60 -o /tmp/g.json -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models/$(grep -oE "gemini-[0-9a-z.-]+" whatsapp-bot/wrangler.toml | head -1):generateContent" \
            -H "x-goog-api-key: $GEMINI_KEY" -H 'content-type: application/json' -d '{"contents":[{"role":"user","parts":[{"text":"Скажи привет одним словом"}]}]}')
          python3 -c "import json;d=json.load(open('/tmp/g.json'));print(json.dumps({'gemini_http':'$g','error':(d.get('error') or {}).get('message','')[:300],'ok_text':bool(d.get('candidates'))},ensure_ascii=False))" > whatsapp-bot/gemini-test.json
          cat whatsapp-bot/gemini-test.json
          url=$(cat whatsapp-bot/URL.txt)
          secret=$(printf 'kelechek-tg:%s' "$TG_CLIENT_TOKEN" | sha256sum | cut -c1-48)
          uid=$(date +%s)
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$url/tg" -H "x-telegram-bot-api-secret-token: $secret" -H 'content-type: application/json' \
            -d "{\"update_id\": $uid, \"message\": {\"message_id\": 1, \"chat\": {\"id\": 1, \"type\": \"private\"}, \"from\": {\"id\": 1, \"is_bot\": false, \"first_name\": \"Test\"}, \"text\": \"Здравствуйте, у меня кофейня в Бишкеке, мало клиентов\"}}")
          sleep 25
          curl -s -m 30 "$url/health" > whatsapp-bot/health.json
          echo "{\"post_http\": \"$code\"}" > whatsapp-bot/selftest.json
          cat whatsapp-bot/health.json
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add whatsapp-bot/health.json whatsapp-bot/selftest.json whatsapp-bot/gemini-test.json
          git diff --cached --quiet || git commit -m "bot: самопроверка [skip ci]"
          git pull --rebase origin main && git push
