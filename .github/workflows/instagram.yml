name: Instagram reels
on:
  schedule:
    - cron: "7 13 * * *"   # каждый день в 19:07 по Бишкеку
  workflow_dispatch:
    inputs:
      test:
        description: "Только собрать ролик и выложить в media/ для просмотра"
        type: boolean
        default: false
      voice:
        description: "Голос: piper или chatterbox (живее, синтез медленнее)"
        type: choice
        options: [piper, chatterbox]
        default: piper
permissions:
  contents: write
concurrency: posts-json
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }  # свежий posts.json, а не тот, что был при постановке в очередь
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Браузер для HyperFrames (промо-стиль Reels)
        run: npx --yes hyperframes@0.8.121 browser ensure
      - name: Голос Chatterbox (MIT)
        if: inputs.voice == 'chatterbox'
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
          mkdir -p assets/voice
          # образец голоса из демо Resemble, пока владелец не записал свой
          curl -sSfL -o assets/voice/ref.flac https://storage.googleapis.com/chatterbox-demo-samples/mtl_prompts/ru_m.flac
      - name: Голос для озвучки (Piper, ru_RU-dmitri, CC0)
        continue-on-error: true
        run: |
          mkdir -p assets/voice && cd assets/voice
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium
          curl -sSfL -o ru_RU-dmitri-medium.onnx $base/ru_RU-dmitri-medium.onnx
          curl -sSfL -o ru_RU-dmitri-medium.onnx.json $base/ru_RU-dmitri-medium.onnx.json
      - run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          python reels.py ${{ inputs.test && '--test' || '' }}
        env:
          VOICE_ENGINE: ${{ inputs.voice || 'piper' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Сохранить отметку о публикации
        run: |
          git add posts.json
          if [ -f reels.json ]; then git add reels.json; fi
          if [ -f used_clips.json ]; then git add used_clips.json; fi
          git diff --cached --quiet || git commit -m "reels: отметка публикации"
          git pull --rebase origin main
          git push
