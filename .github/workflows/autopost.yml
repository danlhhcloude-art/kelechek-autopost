name: Threads autopost
on:
  schedule:
    - cron: "0 3 * * *"   # 9:00 по Бишкеку (UTC+6)
    - cron: "0 7 * * *"   # 13:00 по Бишкеку
    - cron: "0 12 * * *"  # 18:00 по Бишкеку
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: posts-json
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python autopost.py
        env:
          THREADS_USER_ID: "28058715777164226"
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Собрать статистику
        if: always()
        continue-on-error: true
        run: python autopost.py --stats
        env:
          THREADS_USER_ID: "28058715777164226"
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Сохранить отметки об опубликованных постах и статистику
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add posts.json
          if [ -f stats.json ]; then git add stats.json; fi
          git diff --cached --quiet || git commit -m "autopost: отметка публикации"
          git pull --rebase origin main
          git push
