name: WhatsApp bot deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["whatsapp-bot/**", ".github/workflows/whatsapp-bot.yml"]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run: { working-directory: whatsapp-bot }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Проверить секреты
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Нет CLOUDFLARE_API_TOKEN, бот пока не разворачиваю"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: KV для переписок
        if: steps.check.outputs.skip != '1'
        run: |
          id=$(npx --yes wrangler@4 kv namespace list | jq -r '.[] | select(.title|endswith("kelechek-whatsapp-chats")) | .id')
          if [ -z "$id" ]; then
            npx wrangler@4 kv namespace create kelechek-whatsapp-chats
            id=$(npx wrangler@4 kv namespace list | jq -r '.[] | select(.title|endswith("kelechek-whatsapp-chats")) | .id')
          fi
          sed -i "s/REPLACE_WITH_KV_ID/$id/" wrangler.toml
      - name: Поддомен workers.dev
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        run: |
          api=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          have=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $api | jq -r '.result.subdomain // empty')
          if [ -z "$have" ]; then
            for name in kelechek-ai kelechekai kelechek-bishkek; do
              ok=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                   --data "{\"subdomain\":\"$name\"}" $api | jq -r '.success')
              echo "$name: $ok"
              [ "$ok" = "true" ] && break
            done
          else
            echo "поддомен уже есть: $have"
          fi
      - name: Развернуть
        if: steps.check.outputs.skip != '1'
        run: |
          set +e
          npx wrangler@4 deploy > /tmp/deploy.txt 2>&1
          code=$?
          cat /tmp/deploy.txt
          exit $code
      - name: Секреты бота
        if: steps.check.outputs.skip != '1'
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          LEADS_KEY: ${{ secrets.WA_LEADS_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CLIENT_TOKEN: ${{ secrets.TG_CLIENT_TOKEN }}
        run: |
          python3 - > /tmp/s.json <<'PY'
          import json, os
          keys = ["WA_TOKEN", "WA_PHONE_ID", "WA_APP_SECRET", "VERIFY_TOKEN", "GEMINI_KEY", "LEADS_KEY", "TG_BOT_TOKEN", "TG_CHAT_ID", "TG_CLIENT_TOKEN"]
          print(json.dumps({k: os.environ[k] for k in keys if os.environ.get(k)}))
          PY
          npx wrangler@4 secret bulk /tmp/s.json
          rm /tmp/s.json
      - name: Вебхук Telegram-бота
        if: steps.check.outputs.skip != '1'
        env:
          TG_CLIENT_TOKEN: ${{ secrets.TG_CLIENT_TOKEN }}
        run: |
          # без токена Telegram просто пропускаем; в файл пишем только ok/описание ошибки, без токена
          if [ -z "$TG_CLIENT_TOKEN" ]; then echo '{"telegram":"нет TG_CLIENT_TOKEN"}' > tg-webhook.json; exit 0; fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -1)
          [ -n "$url" ] || url=$(cat URL.txt)
          secret=$(printf 'kelechek-tg:%s' "$TG_CLIENT_TOKEN" | sha256sum | cut -c1-48)
          curl -s -m 30 "https://api.telegram.org/bot$TG_CLIENT_TOKEN/setWebhook" \
            -d "url=$url/tg" -d "secret_token=$secret" -d 'allowed_updates=["message"]' -d drop_pending_updates=true > /tmp/sw.json
          me=$(curl -s -m 30 "https://api.telegram.org/bot$TG_CLIENT_TOKEN/getMe" | python3 -c "import json,sys;print(json.load(sys.stdin).get('result',{}).get('username',''))")
          python3 -c "import json;d=json.load(open('/tmp/sw.json'));print(json.dumps({'ok':d.get('ok'),'description':d.get('description'),'bot':'@$me'},ensure_ascii=False))" > tg-webhook.json
          cat tg-webhook.json
      - name: Сохранить адрес и журнал деплоя
        if: always() && steps.check.outputs.skip != '1'
        run: |
          # без секретов: только вывод wrangler (адрес бота, ошибки), чтобы Claude видел результат
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -1 > URL.txt || true
          tail -40 /tmp/deploy.txt | sed -E 's/[A-Za-z0-9_-]{30,}/…/g' > deploy-log.txt || true
          git checkout -- wrangler.toml
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add URL.txt deploy-log.txt tg-webhook.json 2>/dev/null || git add URL.txt deploy-log.txt
          git diff --cached --quiet || git commit -m "whatsapp-bot: адрес и журнал деплоя [skip ci]"
          git pull --rebase origin main && git push
